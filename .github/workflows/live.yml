# fongmi-live：直播专用版的构建与发布。
#
# 本分支已冻结（2026-10-10）：不再定期跟进上游 FongMi/TV。
# - push 到 live：构建并发布。
# - 手动触发：构建并发布；勾选 sync_upstream 时先尝试 rebase 到上游最新代码
#   （仅在需要挑选上游某个修复时使用，rebase 出现真实冲突会失败）。
#
# 播放器依赖的 FongMi 魔改 media3 已预先编译，存放在本仓库的预发布 Release
# （MEDIA3_TAG）里，构建时下载并校验，不依赖上游仓库是否继续存在。
#
# 发布物（GitHub Releases, latest）：
#   leanback-armeabi_v7a.apk / leanback-arm64_v8a.apk  —— 电视按 CPU 位数自取
#   leanback.json  {name, desc, code}                 —— App 内自动更新据此判断新版本
#
# 需要的仓库 Secrets：KEYSTORE_BASE64、KEYSTORE_PASSWORD、KEY_ALIAS
name: live

on:
  push:
    branches: [live]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 先 rebase 到上游 FongMi/TV 最新代码
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

env:
  MEDIA3_TAG: media3-3c2cbe8
  MEDIA3_ZIP: media3-aars-3c2cbe8.zip
  MEDIA3_SHA256: 3dd929216f0f7482bacae6053f08e7ce7d5be75b086b6aaa16cf799d8bb21ccb

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' && inputs.sync_upstream
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 0

      - name: Rebase onto upstream FongMi/TV
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/sync-upstream.sh

      - name: Push rebased live
        if: steps.sync.outputs.changed == 'true'
        run: git push --force-with-lease origin live

  build:
    needs: sync
    # sync 未运行（skipped）时照常构建；sync 失败（真实冲突）时不构建。
    # 由 GITHUB_TOKEN 推送的提交不会再触发工作流，所以同步后的构建在同一次运行里完成。
    if: always() && needs.sync.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null
          "$SDKM" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Fetch pinned media3 AARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$MEDIA3_TAG" -p "$MEDIA3_ZIP" -D "$RUNNER_TEMP"
          echo "$MEDIA3_SHA256  $RUNNER_TEMP/$MEDIA3_ZIP" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$MEDIA3_ZIP" -d "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/media3-aars" && sha256sum -c SHA256SUMS)
          cp "$RUNNER_TEMP"/media3-aars/lib-*.aar app/libs/

      - name: Signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'sdk.dir=%s\nstoreFile=%s\nkeyAlias=%s\nstorePassword=%s\n' \
            "$ANDROID_HOME" "$RUNNER_TEMP/release.jks" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > local.properties

      - name: Build APK
        env:
          LIVE_BUILD_NUMBER: ${{ github.run_number }}
        run: bash ./gradlew :app:assembleLeanbackRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=app/build/outputs/apk/leanback/release
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          BADGE=$("$AAPT" dump badging "$OUT/leanback-armeabi_v7a.apk" | head -1)
          CODE=$(sed -E "s/.*versionCode='([0-9]+)'.*/\1/" <<< "$BADGE")
          NAME=$(sed -E "s/.*versionName='([^']+)'.*/\1/" <<< "$BADGE")
          DESC="live@$(git rev-parse --short HEAD) · ${MEDIA3_TAG}"
          python3 -c 'import json,sys; print(json.dumps({"name": sys.argv[1], "desc": sys.argv[2], "code": int(sys.argv[3])}, ensure_ascii=False))' \
            "$NAME" "$DESC" "$CODE" > "$OUT/leanback.json"
          cat "$OUT/leanback.json"
          gh release create "v$NAME" "$OUT"/leanback-*.apk "$OUT/leanback.json" \
            --target "$(git rev-parse HEAD)" --title "$NAME" --notes "$DESC" --latest
